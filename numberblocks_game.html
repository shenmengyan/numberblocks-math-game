<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numberblocks Math Fun!</title>
    <style>
        /* 基礎樣式和背景 */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #B0E0E6); /* 藍天漸層 */
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* 雲朵動畫 (背景裝飾) */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: moveClouds 20s infinite linear;
        }
        .cloud:nth-child(1) { width: 100px; height: 60px; top: 10%; left: -50px; animation-delay: 0s; }
        .cloud:nth-child(2) { width: 120px; height: 70px; top: 20%; right: -60px; animation-delay: 5s; }
        .cloud:nth-child(3) { width: 80px; height: 50px; top: 30%; left: -40px; animation-delay: 10s; }
        .cloud:nth-child(4) { width: 110px; height: 65px; top: 5%; left: 30%; animation-delay: 15s; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 150px)); }
        }

        /* 遊戲主容器 (手機縱向排版) */
        .game-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .title {
            font-size: 2.2em;
            color: #FF5733;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* 題目區 */
        .question-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            min-height: 100px;
        }

        .question-area img {
            height: 80px;
            object-fit: contain;
            transition: transform 0.3s ease-out;
        }

        .question-area .operator, .question-area .equals {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }
        .question-area .placeholder {
            width: 80px;
            height: 80px;
            border: 2px dashed #999;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            color: #666;
            font-weight: bold;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }

        /* 選項區 */
        .options-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3個選項 */
            gap: 15px;
            margin-top: 20px;
        }

        .option-button {
            background-color: #fff;
            border: 3px solid #FFC300;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90px;
        }
        .option-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }
        .option-button.correct {
            border-color: #4CAF50; /* 答對綠色 */
        }
        .option-button.wrong {
            border-color: #F44336; /* 答錯紅色 */
        }

        .option-button img {
            height
