<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>千荷’s Math Party</title>
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Comic Sans MS', 'Varela Round', "微軟正黑體", sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#b2ebf2 15%, transparent 16%), radial-gradient(#b2ebf2 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            color: #01579b;
            margin: 5px 0 0 0; /* 修改下方邊距，讓副標題靠近一點 */
            font-size: 24px;
            text-shadow: 2px 2px white;
        }

        /* === 新增：副標題樣式 === */
        .subtitle {
            color: #e91e63; /* 亮眼的粉紅色 */
            font-size: 20px;
            margin-top: 2px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 1px 1px white;
            letter-spacing: 1px;
        }
        /* ====================== */

        /* === 計分板樣式 === */
        .scoreboard {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            border: 3px solid #fbc02d;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 100;
        }
        .score-num {
            color: #e91e63;
            font-size: 24px;
        }

        /* 遊戲主容器 */
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 500px;
            border: 6px solid #fff;
            margin-top: 5px;
            position: relative; 
            z-index: 2;
        }

        /* 題目區域 */
        .problem-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin: 10px 0;
            min-height: 130px;
        }

        .symbol {
            font-size: 36px;
            font-weight: 900;
            color: #555;
            margin: 0 2px;
        }

        /* 圖片顯示樣式 */
        .nb-character {
            height: 100px;
            width: auto;
            max-width: 80px;
            object-fit: contain;
            filter: drop-shadow(3px 3px 3px rgba(0,0,0,0.2));
        }

        .number-label {
            font-size: 26px;
            font-weight: bold;
            margin-top: 0px;
            color: #333;
        }

        .character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 85px;
        }

        /* 選項按鈕區域 */
        .options-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background-color: #fff;
            border: 4px solid #fbc02d;
            border-radius: 20px;
            width: 85px;
            height: 115px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-shadow: 0 4px #f9a825;
            position: relative; 
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn img {
            height: 65px;
            width: auto;
            max-width: 65px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .option-btn span {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #f9a825;
        }

        /* 錯誤答案的紅叉叉樣式 */
        .option-btn.wrong {
            background-color: #ffebee;
            border-color: #ef9a9a;
            box-shadow: none;
            transform: translateY(2px);
        }

        .option-btn.wrong::after {
            content: "✖";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: rgba(255, 0, 0, 0.8);
            font-weight: bold;
            text-shadow: 2px 2px 0px white;
            pointer-events: none;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-55%, -50%) rotate(-5deg); }
            50% { transform: translate(-45%, -50%) rotate(5deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        /* 備用框 */
        .empty-box {
            width: 60px;
            height: 60px;
            border: 3px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ccc;
            background: #f9f9f9;
        }

        /* 回饋訊息 */
        .feedback {
            height: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        /* 特效層 */
        #effects-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 50;
        }

        .confetti {
            position: absolute;
            top: -50px;
            font-size: 30px;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

    </style>
</head>
<body>

    <!-- 計分板 -->
    <div class="scoreboard">
        ⭐ 得分: <span id="score" class="score-num">0</span>
    </div>

    <div id="effects-container"></div>

    <h1>Numberblocks 數學派對</h1>
    <!-- 新增的副標題 -->
    <div class="subtitle">千荷’s Math Party</div>
    
    <div class="game-container">
        <div class="feedback" id="message">選一個答案吧！</div>

        <!-- 題目區 -->
        <div class="problem-area">
            <div class="character-wrapper">
                <div id="img-left"></div>
                <div class="number-label" id="num-left"></div>
            </div>

            <div class="symbol" id="op-symbol">+</div>

            <div class="character-wrapper">
                <div id="img-right"></div>
                <div class="number-label" id="num-right"></div>
            </div>

            <div class="symbol">=</div>
            
            <div class="symbol" style="color:#e91e63; font-size:50px;">?</div>
        </div>

        <!-- 選項區 -->
        <div class="options-area" id="options-container"></div>
    </div>

    <script>
        // ==========================================
        // 音效設定 
        // ==========================================
        const correctSound = new Audio("fireworks.mp3");
        const wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");
        
        correctSound.load();
        wrongSound.load();
        // ==========================================

        let currentAnswer = 0;
        let score = 0;
        const positivePhrases = ["好棒喔！", "答對了！", "太厲害了！", "做得好！", "Bingo!"];

        function getImgTag(num, isSmall = false) {
            let className = isSmall ? '' : 'nb-character pop-in';
            let style = isSmall ? 'style="height:65px;max-width:65px;object-fit:contain;margin-bottom:5px;"' : '';
            
            return `<img src="${num}.png" class="${className}" ${style} alt="${num}" 
                    onerror="this.onerror=null; this.src='${num}.PNG'; this.nextElementSibling ? this.nextElementSibling.style.display='block' : null; if(this.src.includes('PNG')) { this.onerror = function(){ this.style.display='none'; if(this.parentElement) this.parentElement.innerText='${num}'; } }">`;
        }

        function newQuestion() {
            document.getElementById('effects-container').innerHTML = '';
            document.getElementById('message').innerText = " "; 

            let isAddition = Math.random() > 0.5;
            let num1, num2;

            if (isAddition) {
                num1 = Math.floor(Math.random() * 6); 
                num2 = Math.floor(Math.random() * (11 - num1)); 
                if (num1 === 0 && num2 === 0) num2 = 1; 
                currentAnswer = num1 + num2;
                document.getElementById('op-symbol').innerText = '+';
            } else {
                num1 = Math.floor(Math.random() * 10) + 1; 
                num2 = Math.floor(Math.random() * (num1 + 1)); 
                currentAnswer = num1 - num2;
                document.getElementById('op-symbol').innerText = '-';
            }

            document.getElementById('img-left').innerHTML = getImgTag(num1);
            document.getElementById('num-left').innerText = num1;
            
            document.getElementById('img-right').innerHTML = getImgTag(num2);
            document.getElementById('num-right').innerText = num2;

            generateOptions(currentAnswer);
        }

        function generateOptions(correct) {
            let container = document.getElementById('options-container');
            container.innerHTML = '';

            let options = new Set();
            options.add(correct);

            while (options.size < 3) {
                let wrong = Math.floor(Math.random() * 11);
                if (wrong !== correct) options.add(wrong);
            }

            let optionsArray = Array.from(options).sort(() => Math.random() - 0.5);

            optionsArray.forEach(num => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                let imgHtml = getImgTag(num, true);
                btn.innerHTML = `${imgHtml}<span>${num}</span>`;
                btn.onclick = () => checkAnswer(num, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            let msgDiv = document.getElementById('message');
            let scoreSpan = document.getElementById('score');
            
            if (selected === currentAnswer) {
                // === 答對 ===
                score++;
                scoreSpan.innerText = score;

                console.log("Attempting to play correct sound...");
                correctSound.currentTime = 0; 
                correctSound.play().catch(e => console.error("音效播放失敗 (請確認 fireworks.mp3 存在):", e));

                let phrase = positivePhrases[Math.floor(Math.random() * positivePhrases.length)];
                msgDiv.innerText = `${phrase}`;
                msgDiv.style.color = "#4CAF50";
                
                btnElement.style.backgroundColor = "#81c784";
                btnElement.style.borderColor = "#4CAF50";
                btnElement.style.transform = "scale(1.1)";
                
                createConfetti();
                setTimeout(newQuestion, 2500);
            } else {
                // === 答錯 ===
                wrongSound.currentTime = 0;
                wrongSound.play().catch(e => console.error("錯誤音效失敗:", e));

                // 錯誤時顯示紅叉叉並鎖定按鈕
                btnElement.classList.add('wrong');
                btnElement.disabled = true; 

                msgDiv.innerText = "再試試看？";
                msgDiv.style.color = "#ff7043";
            }
        }

        function createConfetti() {
            const emojis = ['⭐', '🎈', '✨', '🎉', '100', '🎆'];
            const container = document.getElementById('effects-container');
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                container.appendChild(el);
            }
        }

        newQuestion();

    </script>
</body>
</html>
