<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numberblocks Math Fun! (Final Animated Build)</title>
    <style>
        /* 基礎樣式和響應式排版 */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #B0E0E6);
            margin: 0;
            position: relative;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        
        /* 雲朵動畫 (背景裝飾) */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: moveClouds 20s infinite linear;
        }
        .cloud:nth-child(1) { width: 10vw; height: 6vw; top: 10%; left: -5vw; animation-delay: 0s; }
        .cloud:nth-child(2) { width: 12vw; height: 7vw; top: 20%; right: -6vw; animation-delay: 5s; }
        .cloud:nth-child(3) { width: 8vw; height: 5vw; top: 30%; left: -4vw; animation-delay: 10s; }
        .cloud:nth-child(4) { width: 11vw; height: 6.5vw; top: 5%; left: 30%; animation-delay: 15s; }
        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(105vw); }
        }

        /* 遊戲主容器 - 佔據約 80% 的視窗空間 */
        .game-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 30px; 
            padding: 4vmin; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 95%;
            max-width: 90vh; 
            min-height: 98vh; 
            display: flex;
            flex-direction: column;
            gap: 3vmin;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: clamp(24px, 6vmin, 32px);
            color: #FF5733;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        
        /* 計分板樣式 - 位於底部 */
        #scoreDisplay {
            font-size: clamp(20px, 4vmin, 24px);
            font-weight: bold;
            color: #007BFF;
            margin-top: auto; 
            margin-bottom: 5vmin; 
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        /* 題目區 - 核心調整：算式移除 = 和 ? */
        .question-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4vmin; 
            margin-bottom: 4vmin;
            min-height: 30vmin; 
            /* 修正：隱藏等於號和問號佔位符 */
            position: relative;
        }
        .question-area .equals, .question-area .placeholder {
            display: none; 
        }

        .question-area img {
            height: 30vmin; 
            object-fit: contain;
            transition: transform 0.3s ease-out, opacity 0.5s;
            animation: none !important; 
            user-select: none;
            -webkit-user-select: none; 
            -webkit-user-drag: none;
            pointer-events: none; 
        }
        
        /* 靜態圖片的呼吸動畫 */
        @keyframes breathing {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); }
        }
        /* 只對靜態圖片應用 breathing */
        .question-area img[src$=".png"], .option-button img[src$=".png"], 
        .question-area img[src$=".gif"], .option-button img[src$=".gif"] {
             animation: breathing 3s infinite ease-in-out; 
        }

        .question-area .operator {
            font-size: clamp(28px, 10vmin, 36px);
            font-weight: bold;
            color: #333;
        }

        /* --- 動畫舞台 (新增) --- */
        #animationStage {
            min-height: 35vmin; /* 給動畫足夠空間 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 15;
            margin-bottom: 5vmin;
        }

        .anim-element {
            position: absolute;
            transition: all 0.5s;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .anim-element img {
            height: 30vmin; /* 與算式圖片大小一致 */
            object-fit: contain;
            user-select: none;
            pointer-events: none;
        }
        .anim-element span {
            font-size: clamp(28px, 10vmin, 36px);
            font-weight: bold;
            color: #333;
        }

        /* 核心旋轉合體動畫 */
        @keyframes spinAndShrink {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(0.8) rotate(360deg); opacity: 1; }
            100% { transform: scale(0); opacity: 0; } /* 消失為答案騰出空間 */
        }
        
        /* 答案出現動畫 */
        @keyframes answerAppear {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- 選項區 (不變) --- */
        .options-area {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 2vmin; 
            margin-top: 2vmin;
            flex-grow: 0; 
            justify-content: center;
        }

        .option-button {
            min-width: 96px;
            min-height: 96px; 
            padding: 1vmin;
            margin: 4px; 
            border: 4px solid #FFC300; 
            border-radius: 20px; 
            cursor: pointer;
            position: relative;
            height: 22vmin; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .option-button img {
            height: 100%; 
            object-fit: contain;
            animation: none !important;
            user-select: none;
            -webkit-user-select: none; 
            -webkit-user-drag: none;
            pointer-events: none; 
        }

        /* 其它動畫保持不變 */
        @keyframes jumpAndMerge { 0% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-30px); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
        @keyframes flyOut { 0% { transform: translateX(0) scale(1); opacity: 1; } 100% { transform: translate(50px, -50px) scale(0.5); opacity: 0; } }
        @keyframes flashSuccess { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .fireworks-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; overflow: hidden; }
        @keyframes firework { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0) rotate(360deg); opacity: 0; } }
        .firework { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--color); box-shadow: 0 0 8px var(--color); animation: firework 2s ease-out forwards; }
        .wrong-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4em; color: #F44336; font-weight: bold; z-index: 10; animation: popIn 0.3s ease-out forwards; }
        @keyframes popIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        #preload-images { display: none; }
        /* 平板優化 Media Query 保持不變 */
        @media (min-width: 1024px) { /* ... CSS 保持不變 ... */ }
    </style>
</head>
<body>
    
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <div id="fireworksContainer" class="fireworks-container"></div>

    <div class="game-container">
        <div class="title">NUMBERBLOCKS MATH FUN!</div>
        
        <div class="question-area" id="questionArea">
            <img id="num1Img" src="" alt="Numberblock 1">
            <span class="operator" id="operator">+</span>
            <img id="num2Img" src="" alt="Numberblock 2">
            <span class="equals" style="display:none;">=</span>
            <div class="placeholder" id="answerPlaceholder" style="display:none;">?</div>
        </div>
        
        <div id="animationStage">
            <img id="answerImg" src="" style="opacity: 0; height: 35vmin;" alt="Answer Block">
        </div>

        <div class="options-area" id="optionsArea">
        </div>
        
        <div id="scoreDisplay">分數: 0</div> 
    </div>

    <div id="preload-images"></div>

    <audio id="fireworksSound" src="fireworks.mp3" preload="auto"></audio>

    <script>
        // *** 圖片連結：使用本地檔案路徑 (最穩定) ***
        const numberblockImages = {
            1: '1.png', 2: '2.png', 3: '3.png', 4: '4.png', 5: '5.png', 
            6: '6.png', 7: '7.png', 8: '8.png', 9: '9.png', 10: '10.png'
        };

        const questionArea = document.getElementById('questionArea');
        const optionsArea = document.getElementById('optionsArea');
        const num1Img = document.getElementById('num1Img');
        const num2Img = document.getElementById('num2Img');
        const operatorSpan = document.getElementById('operator');
        const fireworksSound = document.getElementById('fireworksSound');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const fireworksContainer = document.getElementById('fireworksContainer');
        const animationStage = document.getElementById('animationStage'); // 新增動畫舞台
        const answerImg = document.getElementById('answerImg'); // 答案圖片
        
        let correctAnswer = 0;
        let num1Value = 0;
        let num2Value = 0;
        let opValue = '';
        let score = 0;
        const ANIMATION_DURATION = 2000; // 2秒動畫總長度 (毫秒)

        // --- 全頁面煙火動畫函式 (功能不變) ---
        function createFireworks() {
            const colors = ['#FFC300', '#FF5733', '#C70039', '#900C3F', '#581845', '#00BFFF', '#32CD32', '#FF69B4'];
            const numBursts = 5; 
            const particlesPerBurst = 40; 
            
            fireworksContainer.innerHTML = '';

            for (let b = 0; b < numBursts; b++) {
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight * 0.7;
                
                for (let i = 0; i < particlesPerBurst; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'firework';
                    const angle = Math.random() * 360;
                    const distance = Math.random() * 250 + 100;
                    const x = Math.cos(angle * Math.PI / 180) * distance;
                    const y = Math.sin(angle * Math.PI / 180) * distance;
                    particle.style.left = `${startX}px`;
                    particle.style.top = `${startY}px`;
                    particle.style.setProperty('--x', `${x}px`);
                    particle.style.setProperty('--y', `${y}px`);
                    particle.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                    particle.style.animationDelay = `${Math.random() * 0.8}s`;
                    fireworksContainer.appendChild(particle);
                }
            }
            
            setTimeout(() => {
                fireworksContainer.innerHTML = '';
            }, 2000); 
        }

        // --- 遊戲核心邏輯 (部分省略) ---
        function preloadAllImages() { /* ... 不變 ... */ }
        function updateScore(points) { /* ... 不變 ... */ }

        function generateQuestion() {
            // 清除舞台
            answerImg.style.opacity = 0;
            animationStage.innerHTML = `<img id="answerImg" src="" style="opacity: 0; height: 35vmin;" alt="Answer Block">`;
            const questionStage = document.getElementById('questionArea');
            questionStage.style.opacity = 1; // 確保算式舞台可見

            let num1, num2, op;
            op = Math.random() < 0.5 ? '+' : '-';

            if (op === '+') {
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * (10 - num1)) + 1;
                correctAnswer = num1 + num2;
            } else { 
                num1 = Math.floor(Math.random() * 9) + 2; 
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1; 
                correctAnswer = num1 - num2;
            }
            
            num1Value = num1;
            num2Value = num2;
            opValue = op;

            num1Img.src = numberblockImages[num1];
            num2Img.src = numberblockImages[num2];
            operatorSpan.textContent = op;

            num1Img.style.animation = 'breathing 3s infinite ease-in-out';
            num2Img.style.animation = 'breathing 3s infinite ease-in-out';
            
            generateOptions(correctAnswer);
        }

        function generateOptions(correctAnswer) { /* ... 不變 ... */ 
            optionsArea.innerHTML = '';
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                const wrongIndicator = btn.querySelector('.wrong-indicator');
                if (wrongIndicator) wrongIndicator.remove();
            });

            let options = new Set();
            options.add(correctAnswer); 
            
            const totalOptions = 3; // 恢復為 3 個選項

            while (options.size < totalOptions) {
                let randomOption = Math.floor(Math.random() * 10) + 1; 
                options.add(randomOption); 
            }

            let shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const button = document.createElement('div');
                button.classList.add('option-button');
                button.innerHTML = `<img src="${numberblockImages[option]}" alt="Numberblock ${option}" data-value="${option}">`;
                button.addEventListener('click', () => checkAnswer(option, button));
                
                const imgElement = button.querySelector('img');
                if (imgElement.src.endsWith('.png') || imgElement.src.endsWith('.gif')) {
                    imgElement.style.animation = 'breathing 3s infinite ease-in-out';
                }
                optionsArea.appendChild(button);
            });
        }


        // --- 核心：視覺合體動畫邏輯 ---
        function playVisualMergeAnimation() {
            const opText = opValue;
            const opSymbol = document.createElement('div');
            opSymbol.className = 'anim-element';
            opSymbol.innerHTML = `<span>${opText}</span>`;
            opSymbol.style.left = '50%';
            opSymbol.style.transform = 'translate(-50%, 0)';
            opSymbol.style.opacity = 0;
            
            // 創建 Num1 和 Num2 的動畫副本
            const num1Copy = document.createElement('div');
            num1Copy.className = 'anim-element';
            num1Copy.innerHTML = `<img src="${numberblockImages[num1Value]}" style="height: 30vmin;">`;
            num1Copy.style.left = '50%';
            num1Copy.style.transform = 'translate(-200%, 0)';
            num1Copy.style.opacity = 0;

            const num2Copy = document.createElement('div');
            num2Copy.className = 'anim-element';
            num2Copy.innerHTML = `<img src="${numberblockImages[num2Value]}" style="height: 30vmin;">`;
            num2Copy.style.left = '50%';
            num2Copy.style.transform = 'translate(100%, 0)';
            num2Copy.style.opacity = 0;

            animationStage.innerHTML = '';
            animationStage.appendChild(num1Copy);
            animationStage.appendChild(opSymbol);
            animationStage.appendChild(num2Copy);
            
            // 1. 元素飛入中央 (0s - 0.5s)
            setTimeout(() => {
                num1Copy.style.opacity = 1;
                num2Copy.style.opacity = 1;
                opSymbol.style.opacity = 1;
                num1Copy.style.transform = 'translate(-100%, 0)'; // 向左移動到位
                num2Copy.style.transform = 'translate(0%, 0)';    // 向右移動到位
            }, 50);

            // 2. 快速旋轉合體 (0.5s - 1.5s)
            setTimeout(() => {
                // 隱藏合體元素
                num1Copy.style.animation = 'spinAndShrink 1s ease-in forwards';
                num2Copy.style.animation = 'spinAndShrink 1s ease-in forwards';
                opSymbol.style.animation = 'spinAndShrink 1s ease-in forwards';
                
                // 答案圖片準備出現
                answerImg.src = numberblockImages[correctAnswer];
                answerImg.style.height = '35vmin';
                answerImg.style.position = 'absolute'; // 確保在舞台中央
                answerImg.style.transform = 'translate(-50%, 0)';
                answerImg.style.left = '50%';
                answerImg.style.zIndex = '2';
                animationStage.appendChild(answerImg);

                // 答案出現動畫
                setTimeout(() => {
                    answerImg.style.animation = 'answerAppear 0.5s ease-out forwards';
                }, 800);

            }, 500);

            // 3. 清理與下一題 (2.0s)
            setTimeout(() => {
                const questionStage = document.getElementById('questionArea');
                questionStage.style.opacity = 1;
                
                // 清除所有動畫效果
                num1Copy.remove();
                num2Copy.remove();
                opSymbol.remove();
                answerImg.style.animation = ''; // 停止答案動畫
                
                // 遊戲流程繼續
                generateQuestion();
                document.querySelectorAll('.option-button').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                });
            }, ANIMATION_DURATION + 50); 
        }


        function playSuccessAnimation() {
            // 播放音效
            if (fireworksSound) {
                fireworksSound.currentTime = 0;
                fireworksSound.play().catch(e => console.error("Audio play failed:", e));
            }
            
            // 啟動全頁面煙火特效
            createFireworks();
            
            // 隱藏算式區，準備動畫
            const questionStage = document.getElementById('questionArea');
            questionStage.style.opacity = 0;

            // 啟動視覺合體動畫
            playVisualMergeAnimation();
        }

        function checkAnswer(selectedAnswer, button) {
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.style.pointerEvents = 'none';
            });
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('wrong');
                const wrongIndicator = btn.querySelector('.wrong-indicator');
                if (wrongIndicator) wrongIndicator.remove();
            });

            if (selectedAnswer === correctAnswer) {
                button.classList.add('correct');
                updateScore(1);
                playSuccessAnimation();
            } else {
                button.classList.add('wrong');
                const wrongIndicator = document.createElement('div');
                wrongIndicator.classList.add('wrong-indicator');
                wrongIndicator.textContent = '❌';
                button.appendChild(wrongIndicator);
                
                document.querySelectorAll('.option-button').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                });
            }
        }

        // 頁面載入時
        document.addEventListener('DOMContentLoaded', () => {
            // 確保答案圖片存在於 DOM
            const existingAnswerImg = document.getElementById('answerImg');
            if (!existingAnswerImg) {
                const newAnswerImg = document.createElement('img');
                newAnswerImg.id = 'answerImg';
                newAnswerImg.src = '';
                newAnswerImg.style.opacity = 0;
                newAnswerImg.style.height = '35vmin';
                newAnswerImg.alt = 'Answer Block';
                animationStage.appendChild(newAnswerImg);
            }

            preloadAllImages();
            updateScore(0);
            generateQuestion();
        });

    </script>
</body>
</html>
