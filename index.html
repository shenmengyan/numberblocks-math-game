<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numberblocks Math Fun! (Mobile Final)</title>
    <style>
        /* 基礎樣式和響應式排版 */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 修正：確保填滿整個視窗高度 */
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #B0E0E6);
            margin: 0;
            position: relative;
            /* 修正：允許內容在必要時滾動，以防萬一 */
            overflow-y: auto; 
            overflow-x: hidden;
        }
        
        /* 雲朵動畫 (背景裝飾) */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: moveClouds 20s infinite linear;
        }
        .cloud:nth-child(1) { width: 10vw; height: 6vw; top: 10%; left: -5vw; animation-delay: 0s; }
        .cloud:nth-child(2) { width: 12vw; height: 7vw; top: 20%; right: -6vw; animation-delay: 5s; }
        .cloud:nth-child(3) { width: 8vw; height: 5vw; top: 30%; left: -4vw; animation-delay: 10s; }
        .cloud:nth-child(4) { width: 11vw; height: 6.5vw; top: 5%; left: 30%; animation-delay: 15s; }
        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(105vw); }
        }

        /* 遊戲主容器 - 核心修正：佔據約 80% 的視窗空間 */
        .game-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 30px; /* 圓角更大 */
            padding: 4vmin; /* 內邊距增加，內容更開放 */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 95%; /* 佔據大部分寬度 */
            max-width: 90vh; 
            min-height: 90vh; /* 確保佔據足夠垂直空間 */
            display: flex;
            flex-direction: column;
            gap: 3vmin;
            position: relative;
            z-index: 10;
        }

        .title {
            /* 調整：字體大小適中 */
            font-size: 6vmin;
            color: #FF5733;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        
        /* 計分板樣式 */
        #scoreDisplay {
            /* 調整：字體放大 */
            font-size: 4vmin;
            font-weight: bold;
            color: #007BFF;
            margin-bottom: 2vmin;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        /* 題目區 - 修正尺寸，避免溢出，提供空間 */
        .question-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4vmin; /* 間距增加 */
            margin-bottom: 4vmin;
            min-height: 35vmin; /* 確保足夠高度容納圖片 */
        }

        .question-area img {
            /* 修正：圖片尺寸調整到適中，防止溢出 */
            height: 25vmin; 
            object-fit: contain;
            transition: transform 0.3s ease-out, opacity 0.5s;
            animation: none !important; 
        }
        
        /* 靜態圖片的呼吸動畫 (不變) */
        @keyframes breathing {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); }
        }
        /* 只對靜態圖片應用 breathing */
        .question-area img[src$=".png"], .option-button img[src$=".png"], 
        .question-area img[src$=".gif"], .option-button img[src$=".gif"] {
             animation: breathing 3s infinite ease-in-out; 
        }

        .question-area .operator, .question-area .equals {
            /* 修正：運算符號放大 */
            font-size: 10vmin;
            font-weight: bold;
            color: #333;
        }
        .question-area .placeholder {
            /* 修正：問號區塊配合圖片尺寸 */
            width: 25vmin;
            height: 25vmin;
            border: 3px dashed #FFC300; /* 邊框更突出 */
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10vmin;
            color: #666;
            font-weight: bold;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }
        
        /* 選項區 - 核心修改：垂直堆疊 */
        .options-area {
            /* 移除 grid，改用 flex 垂直堆疊 */
            display: flex;
            flex-direction: column;
            gap: 3vmin; /* 增加選項間隔 */
            margin-top: 2vmin;
            flex-grow: 1; /* 佔據剩餘垂直空間 */
            justify-content: flex-start;
        }

        .option-button {
            border: 4px solid #FFC300; /* 邊框更粗，點擊目標更清晰 */
            border-radius: 20px; 
            padding: 2vmin;
            cursor: pointer;
            position: relative;
            /* 讓每個選項佔據整個容器的寬度 */
            width: 100%; 
            /* 讓選項高度增加，圖片有空間展開 */
            height: 22vmin; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .option-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .option-button img {
            height: 100%; /* 圖片在按鈕中充分展開 */
            object-fit: contain;
            animation: none !important;
        }

        /* --- 動態回饋與慶祝 (核心動畫) --- */
        /* (動畫邏輯保持不變) */
        @keyframes jumpAndMerge { 0% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-30px); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
        @keyframes flyOut { 0% { transform: translateX(0) scale(1); opacity: 1; } 100% { transform: translate(50px, -50px) scale(0.5); opacity: 0; } }
        @keyframes flashSuccess { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .question-area.flash .final-answer-img { animation: flashSuccess 0.3s 3; }
        
        /* --- 全頁面煙火粒子動畫 --- */
        .fireworks-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; overflow: hidden; }
        @keyframes firework { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0) rotate(360deg); opacity: 0; } }
        .firework { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--color); box-shadow: 0 0 8px var(--color); animation: firework 2s ease-out forwards; }
        
        /* 答錯的紅叉叉 (不變) */
        .wrong-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4em; color: #F44336; font-weight: bold; z-index: 10; animation: popIn 0.3s ease-out forwards; }
        @keyframes popIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

        #preload-images { display: none; }

    </style>
</head>
<body>
    
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <div id="fireworksContainer" class="fireworks-container"></div>

    <div class="game-container">
        <div class="title">NUMBERBLOCKS MATH FUN!</div>
        
        <div id="scoreDisplay">分數: 0</div> 

        <div class="question-area" id="questionArea">
            <img id="num1Img" src="" alt="Numberblock 1">
            <span class="operator" id="operator">+</span>
            <img id="num2Img" src="" alt="Numberblock 2">
            <span class="equals">=</span>
            <div class="placeholder" id="answerPlaceholder">?</div>
        </div>

        <div class="options-area" id="optionsArea">
        </div>
    </div>

    <div id="preload-images"></div>

    <audio id="fireworksSound" src="fireworks.mp3" preload="auto"></audio>

    <script>
        // *** 圖片連結：使用本地檔案路徑 (最穩定) ***
        const numberblockImages = {
            1: '1.png', 
            2: '2.png',
            3: '3.png',
            4: '4.png',
            5: '5.png',
            6: '6.png',
            7: '7.png',
            8: '8.png',
            9: '9.png',
            10: '10.png'
        };

        const questionArea = document.getElementById('questionArea');
        const optionsArea = document.getElementById('optionsArea');
        const num1Img = document.getElementById('num1Img');
        const num2Img = document.getElementById('num2Img');
        const operatorSpan = document.getElementById('operator');
        const answerPlaceholder = document.getElementById('answerPlaceholder');
        const fireworksSound = document.getElementById('fireworksSound');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const fireworksContainer = document.getElementById('fireworksContainer');
        
        let correctAnswer = 0;
        let num1Value = 0;
        let num2Value = 0;
        let opValue = '';
        let score = 0;

        // --- 全頁面煙火動畫函式 (功能不變) ---
        function createFireworks() {
            const colors = ['#FFC300', '#FF5733', '#C70039', '#900C3F', '#581845', '#00BFFF', '#32CD32', '#FF69B4'];
            const numBursts = 5; 
            const particlesPerBurst = 40; 
            
            fireworksContainer.innerHTML = '';

            for (let b = 0; b < numBursts; b++) {
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight * 0.7;
                
                for (let i = 0; i < particlesPerBurst; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'firework';
                    
                    const angle = Math.random() * 360;
                    const distance = Math.random() * 250 + 100;
                    const x = Math.cos(angle * Math.PI / 180) * distance;
                    const y = Math.sin(angle * Math.PI / 180) * distance;
                    
                    particle.style.left = `${startX}px`;
                    particle.style.top = `${startY}px`;
                    
                    particle.style.setProperty('--x', `${x}px`);
                    particle.style.setProperty('--y', `${y}px`);
                    particle.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                    
                    particle.style.animationDelay = `${Math.random() * 0.8}s`;
                    
                    fireworksContainer.appendChild(particle);
                }
            }
            
            setTimeout(() => {
                fireworksContainer.innerHTML = '';
            }, 2000); 
        }

        // --- 遊戲核心邏輯 ---
        function preloadAllImages() {
            const preloadDiv = document.getElementById('preload-images');
            for (const num in numberblockImages) {
                const img = new Image();
                img.src = numberblockImages[num];
                preloadDiv.appendChild(img);
            }
        }
        
        function updateScore(points) {
            score += points;
            scoreDisplay.textContent = `分數: ${score}`;
        }

        function generateQuestion() {
            questionArea.classList.remove('correct-answer', 'flash');
            answerPlaceholder.innerHTML = '?'; 
            answerPlaceholder.style.backgroundColor = '#f0f0f0'; 
            num1Img.style.opacity = 1;
            num2Img.style.opacity = 1;
            
            let num1, num2, op;
            op = Math.random() < 0.5 ? '+' : '-';

            if (op === '+') {
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * (10 - num1)) + 1;
                correctAnswer = num1 + num2;
            } else { 
                num1 = Math.floor(Math.random() * 9) + 2; 
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1; 
                correctAnswer = num1 - num2;
            }
            
            num1Value = num1;
            num2Value = num2;
            opValue = op;

            num1Img.src = numberblockImages[num1];
            num2Img.src = numberblockImages[num2];
            operatorSpan.textContent = op;

            num1Img.style.animation = '';
            num2Img.style.animation = '';
            
            if (num1Img.src.endsWith('.png') || num1Img.src.endsWith('.gif')) { num1Img.style.animation = 'breathing 3s infinite ease-in-out'; }
            if (num2Img.src.endsWith('.png') || num2Img.src.endsWith('.gif')) { num2Img.style.animation = 'breathing 3s infinite ease-in-out'; }


            generateOptions(correctAnswer);
        }

        function generateOptions(correctAnswer) {
            optionsArea.innerHTML = '';
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                const wrongIndicator = btn.querySelector('.wrong-indicator');
                if (wrongIndicator) wrongIndicator.remove();
            });


            let options = new Set();
            options.add(correctAnswer); 

            while (options.size < 3) {
                let randomOption = Math.floor(Math.random() * 10) + 1; 
                options.add(randomOption); 
            }

            let shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const button = document.createElement('div');
                button.classList.add('option-button');
                button.innerHTML = `<img src="${numberblockImages[option]}" alt="Numberblock ${option}" data-value="${option}">`;
                button.addEventListener('click', () => checkAnswer(option, button));
                
                const imgElement = button.querySelector('img');
                if (imgElement.src.endsWith('.png') || imgElement.src.endsWith('.gif')) {
                    imgElement.style.animation = 'breathing 3s infinite ease-in-out';
                }
                optionsArea.appendChild(button);
            });
        }

        function playSuccessAnimation() {
            // 播放音效
            if (fireworksSound) {
                fireworksSound.currentTime = 0;
                fireworksSound.play().catch(e => console.error("Audio play failed:", e));
            }
            
            // 啟動全頁面煙火特效
            createFireworks();

            // 答對動畫
            let finalImg = `<img class="final-answer-img" src="${numberblockImages[correctAnswer]}" alt="Answer ${correctAnswer}" style="height: 100%; object-fit: contain;">`;
            answerPlaceholder.innerHTML = finalImg;
            answerPlaceholder.style.backgroundColor = '#D4EDDA'; 
            questionArea.classList.add('flash');

            if (opValue === '+') {
                // 加法：num2 瞬間向上跳躍並消失合體
                num2Img.style.animation = 'jumpAndMerge 0.6s ease-out forwards';
                num1Img.style.animation = 'flashSuccess 0.3s 3'; 
            } else {
                // 減法：num2 飛出，模擬分離
                num2Img.style.animation = 'flyOut 0.8s ease-in forwards';
                num1Img.style.animation = 'flashSuccess 0.3s 3'; 
            }
            
            // 2 秒後 (短暫慶祝時間) 生成新題目
            setTimeout(() => {
                generateQuestion();
                document.querySelectorAll('.option-button').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                });
            }, 2000); 
        }

        function checkAnswer(selectedAnswer, button) {
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.style.pointerEvents = 'none';
            });
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('wrong');
                const wrongIndicator = btn.querySelector('.wrong-indicator');
                if (wrongIndicator) wrongIndicator.remove();
            });

            if (selectedAnswer === correctAnswer) {
                button.classList.add('correct');
                updateScore(1);
                playSuccessAnimation();
            } else {
                button.classList.add('wrong');
                const wrongIndicator = document.createElement('div');
                wrongIndicator.classList.add('wrong-indicator');
                wrongIndicator.textContent = '❌';
                button.appendChild(wrongIndicator);
                
                document.querySelectorAll('.option-button').forEach(btn => {
                    btn.style.pointerEvents = 'auto';
                });
            }
        }

        // 頁面載入時
        document.addEventListener('DOMContentLoaded', () => {
            preloadAllImages();
            updateScore(0);
            generateQuestion();
        });

    </script>
</body>
</html>
