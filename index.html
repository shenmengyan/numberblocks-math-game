<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numberblocks 數學派對</title>
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Comic Sans MS', 'Varela Round', "微軟正黑體", sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#b2ebf2 15%, transparent 16%), radial-gradient(#b2ebf2 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            color: #01579b;
            margin: 10px 0;
            font-size: 26px;
            text-shadow: 2px 2px white;
        }

        /* 遊戲主容器 */
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 500px;
            border: 6px solid #fff;
        }

        /* 題目區域 */
        .problem-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin: 15px 0;
            min-height: 130px;
        }

        .symbol {
            font-size: 40px;
            font-weight: 900;
            color: #555;
            margin: 0 2px;
        }

        /* 圖片顯示樣式 */
        .nb-character {
            height: 100px;
            width: auto;
            max-width: 80px;
            object-fit: contain;
            filter: drop-shadow(3px 3px 3px rgba(0,0,0,0.2));
        }

        .number-label {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
            color: #333;
        }

        .character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 85px;
        }

        /* 選項按鈕區域 */
        .options-area {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background-color: #fff;
            border: 4px solid #fbc02d;
            border-radius: 20px;
            width: 90px;
            height: 120px; /* 高度足夠放圖片和數字 */
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-shadow: 0 4px #f9a825;
        }

        .option-btn img {
            height: 70px;
            width: auto;
            max-width: 70px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .option-btn span {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #f9a825;
        }

        /* 0 的空框框 */
        .empty-box {
            width: 60px;
            height: 60px;
            border: 3px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ccc;
            background: #f9f9f9;
        }

        /* 回饋訊息 */
        .feedback {
            height: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        /* 動畫特效 */
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .confetti { position: absolute; top: -50px; font-size: 30px; animation: fall 3s linear infinite; z-index: 10; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    </style>
</head>
<body>

    <div id="effects-container"></div>

    <h1>Numberblocks 數學派對</h1>
    
    <div class="game-container">
        <div class="feedback" id="message">選一個答案吧！</div>

        <!-- 題目區 -->
        <div class="problem-area">
            <div class="character-wrapper">
                <div id="img-left"></div>
                <div class="number-label" id="num-left"></div>
            </div>

            <div class="symbol" id="op-symbol">+</div>

            <div class="character-wrapper">
                <div id="img-right"></div>
                <div class="number-label" id="num-right"></div>
            </div>

            <div class="symbol">=</div>
            
            <!-- 問號 -->
            <div class="symbol" style="color:#e91e63; font-size:50px;">?</div>
        </div>

        <!-- 選項按鈕 -->
        <div class="options-area" id="options-container"></div>
    </div>

    <script>
        // ==========================================
        // 圖片設定：直接讀取當前資料夾的圖片
        // ==========================================
        const imagePath = ""; // 空字串代表 "同一層資料夾"
        const imageExtension = ".png"; 
        
        function getImagePath(num) {
            return imagePath + num + imageExtension;
        }

        let currentAnswer = 0;
        const positivePhrases = ["好棒喔！", "答對了！", "太厲害了！", "做得好！", "Bingo!"];

        // 產生圖片 HTML
        function getCharacterHtml(num) {
            if (num === 0) {
                return `<div class="empty-box pop-in">0</div>`;
            } else {
                // onerror 用於處理圖片讀取失敗時（例如還沒放圖片），自動顯示文字數字
                return `<img src="${getImagePath(num)}" class="nb-character pop-in" alt="${num}" onerror="this.style.display='none';this.parentElement.innerText='${num}'">`;
            }
        }

        // 產生新題目
        function newQuestion() {
            document.getElementById('effects-container').innerHTML = '';
            document.getElementById('message').innerText = " "; 

            let isAddition = Math.random() > 0.5;
            let num1, num2;

            if (isAddition) {
                // 加法
                num1 = Math.floor(Math.random() * 6); // 0-5
                num2 = Math.floor(Math.random() * (11 - num1)); 
                if (num1 === 0 && num2 === 0) num2 = 1; 
                currentAnswer = num1 + num2;
                document.getElementById('op-symbol').innerText = '+';
            } else {
                // 減法
                num1 = Math.floor(Math.random() * 10) + 1; // 1-10
                num2 = Math.floor(Math.random() * (num1 + 1)); 
                currentAnswer = num1 - num2;
                document.getElementById('op-symbol').innerText = '-';
            }

            document.getElementById('img-left').innerHTML = getCharacterHtml(num1);
            document.getElementById('num-left').innerText = num1;
            
            document.getElementById('img-right').innerHTML = getCharacterHtml(num2);
            document.getElementById('num-right').innerText = num2;

            generateOptions(currentAnswer);
        }

        // 產生選項按鈕（包含圖片和數字）
        function generateOptions(correct) {
            let container = document.getElementById('options-container');
            container.innerHTML = '';

            let options = new Set();
            options.add(correct);

            while (options.size < 3) {
                let wrong = Math.floor(Math.random() * 11);
                if (wrong !== correct) options.add(wrong);
            }

            let optionsArray = Array.from(options).sort(() => Math.random() - 0.5);

            optionsArray.forEach(num => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                
                // 按鈕內容：上圖下字
                let imgHtml;
                if (num === 0) {
                     imgHtml = '<div class="empty-box" style="width:50px;height:50px;font-size:20px;margin-bottom:5px;">0</div>';
                } else {
                     imgHtml = `<img src="${getImagePath(num)}" alt="${num}" onerror="this.style.display='none'">`;
                }
                
                btn.innerHTML = `${imgHtml}<span>${num}</span>`;
                btn.onclick = () => checkAnswer(num, btn);
                container.appendChild(btn);
            });
        }

        // 檢查答案
        function checkAnswer(selected, btnElement) {
            let msgDiv = document.getElementById('message');
            
            if (selected === currentAnswer) {
                let phrase = positivePhrases[Math.floor(Math.random() * positivePhrases.length)];
                msgDiv.innerText = `${phrase}`;
                msgDiv.style.color = "#4CAF50";
                
                btnElement.style.backgroundColor = "#81c784";
                btnElement.style.borderColor = "#4CAF50";
                btnElement.style.transform = "scale(1.1)";
                
                createConfetti();
                setTimeout(newQuestion, 2000); 
            } else {
                msgDiv.innerText = "再試試看？";
                msgDiv.style.color = "#ff7043";
                btnElement.style.opacity = "0.5";
                btnElement.disabled = true;
            }
        }

        function createConfetti() {
            const emojis = ['⭐', '🎈', '✨', '🎉'];
            const container = document.getElementById('effects-container');
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                container.appendChild(el);
            }
        }

        // 啟動
        newQuestion();

    </script>
</body>
</html>
